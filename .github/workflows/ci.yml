name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      # Secret names come from .dev.vars; CI uses the committed example (names only, no values) so the
      # generated types match a developer's machine exactly.
      - name: Generated Worker types are current
        run: cp .dev.vars.example .dev.vars && npx wrangler types && git diff --exit-code worker-configuration.d.ts
      - name: Type check
        run: npm run typecheck
      - name: Schema and migrations agree
        run: npm run db:check
      - name: Migrations apply cleanly
        run: npm run db:migrate:local
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      # Starts the real app on a fresh local database (e2e/server.mjs) and drives it in a browser.
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
