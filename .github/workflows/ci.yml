name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Generated Worker types are current
        run: npx wrangler types && git diff --exit-code worker-configuration.d.ts
      - name: Type check
        run: npm run typecheck
      - name: Schema and migrations agree
        run: npm run db:check
      - name: Migrations apply cleanly
        run: npm run db:migrate:local
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
